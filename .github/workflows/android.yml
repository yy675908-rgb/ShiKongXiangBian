name: Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHIKONG_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing directory
        run: mkdir -p .ci-signing
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: shikongxiangbian-debug-keystore-v2
      - name: Prepare debug signing key if missing
        run: |
          if [ ! -f "$SHIKONG_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SHIKONG_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Check signing certificate
        run: keytool -list -v -keystore "$SHIKONG_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiKongXiangBian-debug
          path: app/build/outputs/apk/debug/app-debug.apk
