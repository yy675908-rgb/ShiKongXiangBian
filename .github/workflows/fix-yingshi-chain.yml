name: Fix Yingshi Chain

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-yingshi-chain.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct analysis chain
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/shikongxiangbian/app/MainActivity.kt')
          s = main.read_text(encoding='utf-8')

          old_steps = 'val steps = listOf("时空", "能量", "气（气势）", "象（象数）", "十神①", "主客体用", "十神②", "应事")'
          new_steps = 'val steps = listOf("时空", "能量", "气象", "主客体用", "十神", "应事")'
          if old_steps not in s:
              raise SystemExit('old pipeline not found')
          s = s.replace(old_steps, new_steps, 1)

          ten = '            item { TenGodCard(snapshot) }\n'
          ten_start = s.index(ten)
          body_start = s.index('            item {\n                EditorCard(\n                    title = "主客 · 体用"', ten_start)
          judgment_start = s.index('            item { JudgmentFrameworkCard() }', body_start)
          body_block = s[body_start:judgment_start]
          s = s[:ten_start] + body_block + ten + s[judgment_start:]
          main.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          old = '**时空 → 能量关系变化 → 气（气势）→ 象（象数）→ 十神① → 主客体用 → 十神② → 应事**'
          new = '**时空 → 能量关系变化 → 气象 → 主客体用 → 十神 → 应事**'
          if old not in r:
              raise SystemExit('old README chain not found')
          r = r.replace(old, new, 1)
          readme.write_text(r, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app/src/main/java/com/shikongxiangbian/app/MainActivity.kt
          git commit -m "fix: align yingshi analysis chain"
          git push

# trigger: corrected ordering
